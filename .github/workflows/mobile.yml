name: Mobile libraries

# Builds passer-ffi for phones, with the generated Swift and Kotlin bindings:
# - on workflow_dispatch: as workflow artifacts, to check the build;
# - on a `mobile-v*` tag: as assets of a GitHub pre-release, which the Passer app fetches.

on:
  workflow_dispatch:
  push:
    tags: ["mobile-v*"]

permissions:
  contents: write

jobs:
  ios:
    runs-on: macos-latest
    env:
      # The app's minimum iOS. Without it, the C parts (ring) target the runner's SDK
      # version, and the linker warns that they need a newer iOS than the app.
      IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios, aarch64-apple-ios-sim, x86_64-apple-ios
      - uses: Swatinem/rust-cache@v2
        with:
          # Part of the cache key: some build scripts (blake3) don't rerun when
          # IPHONEOS_DEPLOYMENT_TARGET changes, so a new target needs a new cache.
          key: ios-${{ env.IPHONEOS_DEPLOYMENT_TARGET }}
      - name: Build the static libraries
        run: |
          for t in aarch64-apple-ios aarch64-apple-ios-sim x86_64-apple-ios; do
            cargo build -p passer-ffi --release --lib --target "$t"
          done
          mkdir -p out/sim
          lipo -create \
            target/aarch64-apple-ios-sim/release/libpasser_ffi.a \
            target/x86_64-apple-ios/release/libpasser_ffi.a \
            -output out/sim/libpasser_ffi.a
      - name: Generate the Swift bindings
        run: |
          cargo build -p passer-ffi --release --lib
          cargo run -p uniffi-bindgen --release -- generate \
            --library target/release/libpasser_ffi.dylib --language swift --out-dir out/swift --no-format
          mkdir -p out/headers
          cp out/swift/passer_ffiFFI.h out/headers/
          cp out/swift/passer_ffiFFI.modulemap out/headers/module.modulemap
      - name: Package the XCFramework
        run: |
          xcodebuild -create-xcframework \
            -library target/aarch64-apple-ios/release/libpasser_ffi.a -headers out/headers \
            -library out/sim/libpasser_ffi.a -headers out/headers \
            -output out/PasserFFI.xcframework
          mkdir -p dist/passer-core-ios
          cp -R out/PasserFFI.xcframework dist/passer-core-ios/
          cp out/swift/passer_ffi.swift dist/passer-core-ios/
          (cd dist && zip -qry passer-core-ios.zip passer-core-ios)
          ls -lh dist/passer-core-ios.zip
      - uses: actions/upload-artifact@v4
        with:
          name: passer-core-ios
          path: dist/passer-core-ios.zip

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi, x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
      - name: Build the shared libraries
        run: |
          cargo install cargo-ndk --locked
          cargo ndk -t arm64-v8a -t armeabi-v7a -t x86_64 --platform 24 \
            -o dist/passer-core-android/jniLibs build -p passer-ffi --release --lib
      - name: Generate the Kotlin bindings
        run: |
          cargo build -p passer-ffi --release --lib
          cargo run -p uniffi-bindgen --release -- generate \
            --library target/release/libpasser_ffi.so --language kotlin \
            --out-dir dist/passer-core-android/kotlin --no-format
          (cd dist && zip -qr passer-core-android.zip passer-core-android)
          ls -lh dist/passer-core-android.zip
      - uses: actions/upload-artifact@v4
        with:
          name: passer-core-android
          path: dist/passer-core-android.zip

  release:
    if: startsWith(github.ref, 'refs/tags/mobile-v')
    needs: [ios, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish the pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/*.zip \
            --repo "${GITHUB_REPOSITORY}" --prerelease \
            --title "${GITHUB_REF_NAME}" \
            --notes "Prototype builds of passer-ffi for iOS (XCFramework + Swift bindings) and Android (jniLibs + Kotlin bindings). Not for production: see docs/security.md."
