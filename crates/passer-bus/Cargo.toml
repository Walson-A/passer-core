[package]
name = "passer-bus"
description = "Capability bus for passer-core: declare, check, invoke, journal."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true

[dependencies]
passer-identity = { path = "../passer-identity" }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
blake3 = { workspace = true }
hex = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
async-trait = "0.1"
# No default features: schemas must never fetch remote references.
jsonschema = { version = "0.63", default-features = false }

[dev-dependencies]
tempfile = "3"
tokio = { workspace = true, features = ["test-util"] }
