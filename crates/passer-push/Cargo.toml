[package]
name = "passer-push"
description = "Reference push gateway for passer-core: wakes sleeping phones through APNs when the coordination server asks."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true

[[bin]]
name = "passer-push"
path = "src/main.rs"

[dependencies]
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }
# ring, like iroh: no C toolchain beyond what the rest of the workspace needs.
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "http2", "json", "form"] }
# RSA signatures for FCM (constant-time; the `rsa` crate is not).
ring = "0.17"
p256 = { version = "0.13", features = ["ecdsa", "pkcs8", "pem"] }
base64 = "0.22"
clap = { version = "4", features = ["derive", "env"] }
subtle = "2"

[dev-dependencies]
passer-coord = { path = "../passer-coord" }
passer-node = { path = "../passer-node" }
passer-bus = { path = "../passer-bus" }
passer-identity = { path = "../passer-identity" }
passer-membership = { path = "../passer-membership" }
