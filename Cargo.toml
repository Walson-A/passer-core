[workspace]
resolver = "3"
members = ["crates/*"]
exclude = ["fuzz"]

[workspace.package]
publish = false
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Walson-A/passer-core"

[workspace.dependencies]
iroh = "1.5"
iroh-base = { version = "1.5", features = ["key"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
blake3 = "1"
thiserror = "2"
anyhow = "1"
rand = "0.9"
hex = "0.4"
tracing = "0.1"

# Optimise dependencies (crypto, QUIC) even in debug builds: tests run much faster.
[profile.dev.package."*"]
opt-level = 2

# Smaller libraries for phones.
[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
