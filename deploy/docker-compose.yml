# A relay and a coordination server for your own devices, on one machine.
#   docker compose up -d --build        (from this folder)
#   docker compose logs coord           (prints the server id devices need)
services:
  relay:
    build:
      context: .
      dockerfile: Dockerfile.relay
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "7842:7842/udp"
    volumes:
      - ./relay.toml:/config/relay.toml:ro
      - relay-data:/data

  coord:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.coord
    restart: unless-stopped
    ports:
      - "4433:4433/udp"
    volumes:
      - coord-data:/data

volumes:
  relay-data:
  coord-data:
