# A relay and a coordination server for your own devices, on one machine.
#   docker compose up -d --build        (from this folder)
#   docker compose logs coord           (prints the server id devices need)
services:
  relay:
    build:
      context: .
      dockerfile: Dockerfile.relay
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "7842:7842/udp"
    volumes:
      - ./relay.toml:/config/relay.toml:ro
      - relay-data:/data

  coord:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.coord
    restart: unless-stopped
    ports:
      - "4433:4433/udp"
    volumes:
      - coord-data:/data
    # With the push profile, the server wakes sleeping phones through the gateway.
    environment:
      PASSER_COORD_WAKE_URL: ${PASSER_COORD_WAKE_URL:-}
      PASSER_COORD_WAKE_SECRET: ${PASSER_PUSH_SECRET:-}

  # Optional: `docker compose --profile push up -d`, with PASSER_COORD_WAKE_URL set to
  # http://push:8080/wake and the APNs settings below in a .env file next to this one.
  push:
    profiles: ["push"]
    build:
      context: ..
      dockerfile: deploy/Dockerfile.push
    restart: unless-stopped
    environment:
      PASSER_PUSH_SECRET: ${PASSER_PUSH_SECRET:-}
      PASSER_PUSH_APNS_KEY: /secrets/apns.p8
      PASSER_PUSH_APNS_KEY_ID: ${PASSER_PUSH_APNS_KEY_ID:-}
      PASSER_PUSH_APNS_TEAM_ID: ${PASSER_PUSH_APNS_TEAM_ID:-}
      PASSER_PUSH_APNS_TOPIC: ${PASSER_PUSH_APNS_TOPIC:-direct.passer.app}
    volumes:
      - ./apns.p8:/secrets/apns.p8:ro

volumes:
  relay-data:
  coord-data:
